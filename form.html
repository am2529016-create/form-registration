<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-secondary d-flex justify-content-center align-items-center">
    <div class="container bg-white w-50 p-3 mt-4 rounded-2 shadow">
        <form action="">
            <div class="row">
                <div class="col-6">
                    <label for="user" class="form-label">UserName</label>
                    <input type="text" class="form-control" placeholder="enter your username">
                </div>
                <div class="col-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" placeholder="enter your Email">
                </div>
                <div class="col-6">
                    <label for="pass" class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="enter your Password">
                </div>
                <div class="col-6">
                    <label for="pass" class="form-label">Confirm password</label>
                    <input type="password" class="form-control" placeholder="enter your Confirm Password">
                </div>
                <button class="btn bg-primary mt-3 text-white">Submit</button>
            </div>
        </form>
    </div>
</body>
</html>
